name: Telegram to SharePoint / OneDrive

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 文档库内的目标目录（留空使用仓库配置）
        required: false
        type: string
      wait_seconds:
        description: 等待选择文件的秒数（30–1800）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-to-onedrive
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 下载并转存
        env:
          OAUTH_REDIRECT_URI: ${{ vars.OAUTH_REDIRECT_URI || 'http://localhost' }}
          OAUTH_WAIT_SECONDS: ${{ vars.OAUTH_WAIT_SECONDS || '600' }}
          TG_BOT_API_ID: ${{ secrets.TG_BOT_API_ID }}
          TG_BOT_API_HASH: ${{ secrets.TG_BOT_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_BOT_CREATOR_ID: ${{ secrets.TG_BOT_CREATOR_ID }}
          CLIENTID: ${{ secrets.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          TENANTID: ${{ secrets.TENANTID }}
          GIST_ID: ${{ vars.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ENCRYPTION_KEY: ${{ secrets.GIST_ENCRYPTION_KEY }}
          SHAREPOINT_SITE_URL: ${{ vars.SHAREPOINT_SITE_URL || 'https://humilr.sharepoint.com' }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          TARGET_FOLDER: ${{ inputs.folder || vars.TARGET_FOLDER || 'Public/Telegram' }}
          WAIT_SECONDS: ${{ inputs.wait_seconds || vars.WAIT_SECONDS || '300' }}
        run: python transfer.py
