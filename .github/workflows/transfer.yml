name: Telegram to SharePoint / OneDrive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-to-onedrive
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 下载并转存
        env:
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER || 'onedrive' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI || 'http://localhost:8080' }}
          GOOGLE_FOLDER_ID: ${{ secrets.GOOGLE_FOLDER_ID }}
          OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_REDIRECT_URI || 'http://localhost' }}
          OAUTH_WAIT_SECONDS: ${{ secrets.OAUTH_WAIT_SECONDS || '600' }}
          TG_BOT_API_ID: ${{ secrets.TG_BOT_API_ID }}
          TG_BOT_API_HASH: ${{ secrets.TG_BOT_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_BOT_CREATOR_ID: ${{ secrets.TG_BOT_CREATOR_ID }}
          CLIENTID: ${{ secrets.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          TENANTID: ${{ secrets.TENANTID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ENCRYPTION_KEY: ${{ secrets.GIST_ENCRYPTION_KEY }}
          SHAREPOINT_SITE_URL: ${{ secrets.SHAREPOINT_SITE_URL }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          TARGET_FOLDER: ${{ secrets.TARGET_FOLDER || 'Public/Telegram' }}
          WAIT_SECONDS: ${{ secrets.WAIT_SECONDS || '300' }}
          DOWNLOAD_WORKERS: ${{ secrets.DOWNLOAD_WORKERS || '4' }}
        run: python transfer.py
