name: Delete transfer run

on:
  workflow_run:
    workflows: ["Telegram to SharePoint / OneDrive"]
    types: [completed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 删除转存运行记录及日志
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('运行记录不属于当前仓库');
              return;
            }
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  ...context.repo,
                  run_id: run.id
                });
                core.info('转存运行记录及日志已删除');
                break;
              } catch (error) {
                if (error.status === 404) break;
                if (attempt === 3) throw error;
                core.warning(`删除暂未完成，准备第 ${attempt + 1} 次尝试`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
